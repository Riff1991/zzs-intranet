<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intranet ZZS JčK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: pevný levý panel s navigací, obsah v jednom sloupci s kartami; paleta z loga (modrá, zelená, slunce). */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --ink:#142431; --muted:#5b6c7a; --line:#dde5ec;
  --brand:#0b5a8e; --brand-soft:#e4f0f8; --brand-ink:#ffffff;
  --accent:#2c9a5c; --sun:#f0b400; --warn:#b4540a; --warn-soft:#fdf0e3;
  --font-d:'Manrope',system-ui,sans-serif; --font-b:'IBM Plex Sans',system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,36,49,.06),0 6px 20px rgba(20,36,49,.05);
  --fs:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1a24; --surface:#152633; --ink:#e7eff5; --muted:#9db0bf; --line:#25394a;
  --brand:#5eb2e8; --brand-soft:#16384f; --brand-ink:#08202f; --accent:#4cc487; --sun:#f5c63a; --warn:#f0a35e; --warn-soft:#3a2a17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a24; --surface:#152633; --ink:#e7eff5; --muted:#9db0bf; --line:#25394a;
  --brand:#5eb2e8; --brand-soft:#16384f; --brand-ink:#08202f; --accent:#4cc487; --sun:#f5c63a; --warn:#f0a35e; --warn-soft:#3a2a17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
:root[data-a11y="on"]{--fs:19px;--line:#8aa0b1;--muted:#33475a}
:root[data-a11y="on"][data-theme="dark"]{--muted:#c5d3de;--line:#5d7a91}
@media (prefers-color-scheme:dark){:root[data-a11y="on"]:not([data-theme="light"]){--muted:#c5d3de;--line:#5d7a91}}
:root[data-a11y="on"] a{text-decoration:underline}
:root[data-a11y="on"] *{letter-spacing:.01em}

*{box-sizing:border-box}
html,body{height:100%}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-d);line-height:1.2;margin:0;text-wrap:balance}
.skip{position:absolute;left:-999px;top:8px;background:var(--brand);color:var(--brand-ink);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

.app{display:grid;grid-template-columns:272px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px;text-decoration:none;color:var(--ink)}
.brand img{width:40px;height:auto}
.brand b{font-family:var(--font-d);font-size:1.05rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.78rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 12px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.95rem}
.nav a:hover{background:var(--brand-soft)}
.nav a[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:.8rem;color:var(--muted);padding:0 8px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ib.burger{display:none}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px;color:var(--muted);text-align:left}
.search:hover{border-color:var(--brand)}
.search svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.search{min-width:0}.search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:500 .72rem var(--font-b);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--bg)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.ib{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:.88rem;font-weight:500;text-decoration:none;color:var(--ink)}
.ib:hover{border-color:var(--brand);text-decoration:none}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ib.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

.content{padding:28px;max-width:1240px;width:100%;margin:0 auto}
.hero{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:22px}
.hero h1{font-size:1.9rem;font-weight:800}
.hero p{margin:4px 0 0;color:var(--muted)}
.crumb{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.grid{display:grid;gap:20px}
.g-home{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 0}
.card-h h2{font-size:1.08rem;font-weight:700}
.card-b{padding:12px 20px 18px}
.more{font-size:.86rem;font-weight:500;white-space:nowrap}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--brand);text-decoration:none}
.tile .ico{width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.tile .ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-family:var(--font-d);font-size:.95rem;line-height:1.25}
.tile small{color:var(--muted);font-size:.8rem;line-height:1.3}
.tile.ext .ico{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

.news{display:flex;flex-direction:column}
.item{padding:16px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:6px}
.item-t{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.item h3{font-size:1rem;font-weight:700}
.meta{font-size:.82rem;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.item p{margin:8px 0 0;font-size:.94rem;max-width:70ch}
.item .row{display:flex;gap:12px;margin-top:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2}
.tgl{background:none;border:0;padding:0;color:var(--brand);font-weight:500;font-size:.86rem}
.tgl:hover{text-decoration:underline}

.ev{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.date{flex:none;width:52px;text-align:center;border-radius:12px;background:var(--brand-soft);color:var(--brand);padding:6px 0;line-height:1}
.date b{display:block;font:800 1.4rem var(--font-d)}
.date span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ev h3{font-size:.96rem}
.ev p{margin:2px 0 0;font-size:.88rem;color:var(--muted)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--brand-soft)}
td a{font-weight:500}
.fi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 .62rem var(--font-d);letter-spacing:.02em;color:#fff;flex:none}
.fi.folder{background:var(--sun);color:#3d2c00}
.fi.xlsx{background:#1f7a46}.fi.docx{background:#2a5db0}.fi.pdf{background:#c0392b}
.fi svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.nm{display:flex;align-items:center;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font:inherit;color:var(--ink);min-width:0}
.field:focus{outline:3px solid var(--sun);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:.85rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-d);margin-bottom:4px}

.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-h h2{font-size:1.2rem;margin-right:auto;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dh{padding:8px;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg);text-align:center;font-weight:600}
.cal .d{min-height:92px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;font-size:.82rem;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--surface)}
.cal .d:nth-child(7n+8){border-left:0}
.cal .d.o{background:var(--bg);color:var(--muted)}
.cal .d.t .n{background:var(--brand);color:var(--brand-ink)}
.cal .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.8rem}
.cal .e{background:var(--brand-soft);color:var(--brand);border-left:3px solid var(--brand);border-radius:5px;padding:2px 6px;font-size:.76rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border-top:0;border-right:0;border-bottom:0}
.cal .e.l{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-left-color:var(--accent)}

.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lib a{display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500;font-size:.95rem}
.lib a:hover{border-color:var(--brand);text-decoration:none}
.lib .fi{width:36px;height:36px}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:.9rem;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.note svg{width:20px;height:20px;flex:none;stroke:var(--warn);fill:none;stroke-width:2;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:9px 16px;font-weight:600;font-size:.9rem;text-decoration:none}
.btn:hover{text-decoration:none;filter:brightness(1.08)}
.btn.sec{background:transparent;color:var(--brand)}
textarea.field{width:100%;min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem}

.pal-bg{position:fixed;inset:0;background:rgba(8,18,26,.5);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;z-index:60}
.pal-bg.on{display:flex}
.pal{width:100%;max-width:620px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 20px;font:inherit;font-size:1.05rem;color:var(--ink)}
.pal input:focus{outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow-y:auto}
.pal li a{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:9px;color:var(--ink);text-decoration:none}
.pal li a:hover,.pal li a.sel{background:var(--brand-soft);text-decoration:none}
.pal li small{margin-left:auto;color:var(--muted);font-size:.76rem;white-space:nowrap}
.pal .grp{padding:8px 12px 2px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.scrim{display:none}

@media (max-width:1020px){
  .g-home{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:284px;z-index:50;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(8,18,26,.45);z-index:40}
  .ib.burger{display:inline-flex}
  .top{padding:10px 16px;gap:8px}
  .ib{padding:8px 10px}
  .tools{gap:6px}
  .content{padding:20px 16px}
  .search kbd,.ib .lbl{display:none}
  .hero h1{font-size:1.5rem}
  .cal .d{min-height:64px;padding:4px}
  .cal .e{font-size:0;padding:0;height:6px;border-radius:3px;border-left-width:0;background:var(--brand)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.top{display:none}.app{display:block}}

.hub{max-width:760px;margin:12px auto 28px;text-align:center}
.hub h1{font-size:2.3rem;font-weight:800}
.hub-sub{margin:6px 0 20px;color:var(--muted);font-size:1.1rem}
.hub-search{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 20px;color:var(--muted);text-align:left;font-size:1.02rem;box-shadow:var(--shadow)}
.hub-search:hover{border-color:var(--brand)}
.hub-search svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.hub-search span{flex:1}
.hub-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;max-width:1180px;margin:0 auto 36px}
.hub-tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:26px 22px 22px;min-height:220px;background:var(--surface);border:1px solid var(--line);border-radius:20px;color:var(--ink);text-decoration:none;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,box-shadow .15s}
.hub-tile:hover{transform:translateY(-3px);border-color:var(--brand);text-decoration:none}
.hub-tile .ico{width:52px;height:52px;border-radius:15px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:8px}
.hub-tile .ico svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hub-tile h2{font-size:1.3rem;font-weight:800}
.hub-tile p{margin:0;color:var(--muted);font-size:.95rem;line-height:1.45}
.hub-tile small{margin-top:auto;padding-top:10px;color:var(--muted);font-size:.78rem}
.hub-tile .go{position:absolute;right:22px;top:26px;color:var(--brand);opacity:0;transition:opacity .15s,transform .15s}
.hub-tile:hover .go{opacity:1;transform:translateX(3px)}
.hub-tile .go svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hub-foot{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;max-width:1040px;margin:0 auto}
.hub-foot section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px}
.hub-foot h3{font-size:1rem;margin-bottom:6px}
.hub-news{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.hub-news:first-of-type{border-top:0}
.hub-news b{display:block;font-weight:600;font-size:.95rem}
.hub-news small{color:var(--muted);font-size:.8rem}
.hub-news:hover b{color:var(--brand)}
.hub-foot .more{display:inline-block;margin-top:8px}
.hub-q{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.hub-q a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.hub-q a:hover{background:var(--brand-soft)}
.hub-q svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:1100px){.hub-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.hub h1{font-size:1.7rem}.hub-tiles{grid-template-columns:1fr;gap:12px}.hub-tile{min-height:0;padding:20px}.hub-foot{grid-template-columns:1fr}.hub-search kbd{display:none}}
</style>
</head>
<body>
<a class="skip" href="#view">Přejít k hlavnímu obsahu</a>

let lf = {};
function vList(s, l){
  const f = lf[s.key+l.idx] || (lf[s.key+l.idx] = {q:'', path:''});
  const head = `<div class="hero"><div><div class="crumb"><a href="#weby">Weby</a> / <a href="#web-${s.key}">${esc(s.title)}</a> / ${esc(l.title)}</div><h1>${esc(l.title)}</h1><p>${KIND[l.ui]} · ${cnt(l)} položek${l.rows.length>=100?' (zobrazeno prvních 100)':''}</p></div><a class="btn sec" ${A(l.legacy+'/AllItems.aspx')}>Otevřít originál</a></div>`;
  if (!l.rows.length && !(l.files||[]).length) return head + `<section class="card"><div class="card-b">${emptyBox('Seznam je prázdný','V exportu nebyly žádné položky.')}</div></section>`;
  return head + `<div class="bar"><input class="field" id="lq" type="search" placeholder="Hledat v seznamu" aria-label="Hledat v seznamu" style="flex:1;max-width:380px" value="${esc(f.q)}"></div>
    <section class="card"><div class="card-b tw" id="lb"></div></section>`;
}
function bindList(s, l){
  const f = lf[s.key+l.idx], host = $('#lb'); if(!host) return;
  const draw = () => {
    const q = norm(f.q);
    if (l.ui === 'news') { const rows = l.rows.map(r=>({id:NEWS.findIndex(n=>n.list===l && n.title===r.t && n.ts===r.ts)})).filter(x=>x.id>=0).map(x=>NEWS[x.id]).filter(n=>norm(n.title).includes(q)); host.className='card-b news'; paged(host, rows, n=>newsRow(n,false)); if(!rows.length) host.innerHTML=emptyBox('Nic nenalezeno'); return; }
    if (l.ui === 'library') {
      const rows = l.rows.filter(r => norm(r.t+' '+r.c.join(' ')).includes(q));
      const files = (l.files||[]).filter(x => norm(x.p).includes(q));
      host.innerHTML = `<table><thead><tr><th>Název</th><th>Změněno</th><th>Změnil</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="nm">${fi(r.type)}<a ${A(r.h)}>${esc(r.t)}</a></div></td><td>${esc(r.c[2]||'')}</td><td>${esc(r.c[3]||'')}</td></tr>`).join('')}
        ${files.map(x=>`<tr><td><div class="nm">${fi(typeOf('',x.p))}<a ${A(enc(x.u))}>${esc(x.p)}</a></div></td><td colspan="2">${fsize(x.s)}</td></tr>`).join('')}</tbody></table>`;
      if(!rows.length && !files.length) host.innerHTML = emptyBox('Nic nenalezeno'); return; }
    if (l.ui === 'links') {
      const rows = l.rows.filter(r => norm(r.t+' '+r.h+' '+r.c.join(' ')).includes(q));
      host.innerHTML = `<div class="lib" style="margin:6px 0">${rows.map(r=>`<a ${A(r.h)}><span class="fi" style="background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)">${svg('link')}</span><span>${esc(r.t)}<br><small style="color:var(--muted);font-weight:400;word-break:break-all">${esc(r.h)}</small></span></a>`).join('')}</div>`; if(!rows.length) host.innerHTML=emptyBox('Nic nenalezeno'); return; }
    // tabulka (kontakty, katalog, ostatní)
    const skip = new Set(['Přílohy','Upravit','Typ']); const keep = l.cols.map((c,i)=>i).filter(i => !skip.has(l.cols[i]) && l.rows.some(r => r.c[i]));
    const rows = l.rows.filter(r => norm(r.c.join(' ')).includes(q));
    host.innerHTML = `<table><thead><tr>${keep.map(i=>`<th>${esc(l.cols[i])}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,300).map(r=>`<tr>${keep.map(i=>{ const v = r.c[i]||''; return `<td>${/@/.test(v)?`<a href="mailto:${esc(v)}">${esc(v)}</a>`:/^[+\d][\d ]{7,}$/.test(v)?`<a href="tel:${esc(v.replace(/\s/g,''))}">${esc(v)}</a>`:esc(v)}</td>`; }).join('')}</tr>`).join('')}</tbody></table>${rows.length>300?`<p class="meta" style="padding:10px">Zobrazeno prvních 300 z ${rows.length}. Zúžte hledání.</p>`:''}`;
    if(!rows.length) host.innerHTML = emptyBox('Nic nenalezeno');
  };
  $('#lq')?.addEventListener('input', e => { f.q = e.target.value; draw(); }); draw();
}

const PH_NAMES = {CB:'České Budějovice',JH:'Jindřichův Hradec',PI:'Písek',PT:'Prachatice',ST:'Strakonice',TA:'Tábor','ČK':'Český Krumlov'};
let ph = {tab:'all', q:''};
function vPhones(){
  const tabs = ['all', ...Object.keys(D.phones)];
  return `<div class="hero"><div><h1>Telefonní seznamy</h1><p>Kontakty podle základen. ${Object.values(D.phones).reduce((a,b)=>a+b.length,0)} záznamů.</p></div></div>
  <div class="bar"><input class="field" id="pq" type="search" placeholder="Hledat jméno, pracoviště nebo číslo" aria-label="Hledat v kontaktech" style="flex:1;max-width:380px" value="${esc(ph.q)}">

function bindPhones(){
  const draw = () => {
    const q = norm(ph.q).replace(/\s/g,'');
    const rows = Object.entries(D.phones).filter(([k])=>ph.tab==='all'||ph.tab===k).flatMap(([k,r])=>r.map(x=>({...x,k})))
      .filter(x => norm([x.prijmeni,x.jmeno,x.misto,x.klapka,x.cislo,x.mobil].join('')).replace(/\s/g,'').includes(q));
    const h = $('#pb'); if(!rows.length){ h.innerHTML = emptyBox('Nic nenalezeno'); return; }
    const tel = v => v ? `<a href="tel:${esc(v.replace(/\s/g,''))}">${esc(v)}</a>` : '';
    h.innerHTML = `<table><thead><tr><th>Příjmení</th><th>Jméno</th><th>Pracoviště</th><th>Klapka</th><th>Telefon</th><th>Mobil</th>${ph.tab==='all'?'<th>Základna</th>':''}</tr></thead><tbody></tbody></table>`;
    const tb = h.querySelector('tbody'); let n = 100;
    const go = () => { tb.innerHTML = rows.slice(0,n).map(x=>`<tr><td>${esc(x.prijmeni)}</td><td>${esc(x.jmeno)}</td><td>${esc(x.misto)}</td><td>${esc(x.klapka)}</td><td>${tel(x.cislo)}</td><td>${tel(x.mobil)}</td>${ph.tab==='all'?`<td>${x.k}</td>`:''}</tr>`).join('');
      h.querySelector('.more-r')?.remove(); if(rows.length>n){ h.insertAdjacentHTML('beforeend',`<div class="more-r" style="padding:14px;text-align:center"><button class="btn sec">Zobrazit dalších ${Math.min(100,rows.length-n)}</button></div>`); h.querySelector('.more-r button').onclick=()=>{ n+=100; go(); }; } };
    go();
  };
  $('#pq').addEventListener('input', e => { ph.q = e.target.value; draw(); });
  document.querySelectorAll('.chip[data-k]').forEach(b => b.addEventListener('click', () => { ph.tab = b.dataset.k; document.querySelectorAll('.chip[data-k]').forEach(x=>x.setAttribute('aria-pressed', x===b)); draw(); }));
  draw();
}

const NAV = [['domu','Domů','home'],...AREAS.map(a=>['oblast-'+a.k,a.t,a.i]),['--','Přehledy'],['oznameni','Oznámení','bell'],['dokumenty','Všechny dokumenty','file'],['kalendar','Kalendář','cal'],['telefony','Telefonní seznamy','phone'],['--','Archiv webů'],
  ...SITES.map(s=>['web-'+s.key, s.title, s.key==='root'?'home':s.key==='krizove-rizeni'?'alert':s.key==='odbory'?'users':s.key==='vycvikove-stredisko'?'cap':s.key==='predpisy'?'book':'globe'])];
function renderNav(cur){
  $('#nav').innerHTML = NAV.map(n => n[0]==='--' ? `<div class="nav-h">${n[1]}</div>` : `<a href="#${n[0]}" ${cur===n[0]?'aria-current="page"':''}>${svg(n[2])}${esc(n[1])}</a>`).join('');
}
function route(){
  const k = (location.hash||'#domu').slice(1); let html, bind, cur = 'domu', title = 'Domů';
  let m;
  if (k==='domu'||k==='') { html = vHome(); bind = bindHome; }
  else if ((m = k.match(/^oblast-(.+)$/)) && areaBy(m[1])) { const a = areaBy(m[1]); html = vArea(a); cur = k; title = a.t; }
  else if (k==='oznameni') { html = vNews(); bind = bindNews; cur = k; title = 'Oznámení'; }
  else if (k==='dokumenty') { html = vDocs(); cur = k; title = 'Dokumenty'; }
  else if (k==='kalendar') { html = vCal(); cur = k; title = 'Kalendář'; }
  else if (k==='telefony') { html = vPhones(); bind = bindPhones; cur = k; title = 'Telefonní seznamy'; }
  else if (k==='lide') { html = vPeople(); bind = bindPeople; cur = k; title = 'Osoby a skupiny'; }
  else if (k==='weby') { html = vWebs(); cur = 'web-root'; title = 'Weby'; }
  else if ((m = k.match(/^web-(.+)$/)) && siteBy(m[1])) { const s = siteBy(m[1]); html = vWeb(s); cur = k; title = s.title; }
  else if ((m = k.match(/^seznam-(.+)-(\d+)$/)) && siteBy(m[1]) && siteBy(m[1]).lists[+m[2]]) { const s = siteBy(m[1]), l = s.lists[+m[2]]; html = vList(s,l); bind = () => bindList(s,l); cur = 'web-'+s.key; title = l.title+' · '+s.title; }
  else { html = vHome(); bind = bindHome; }
  renderNav(cur); $('#view').innerHTML = html; bind && bind();
  document.title = (title==='Domů'?'':title+' · ')+'Intranet ZZS JčK'; closeMenu(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

function closeMenu(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); $('#burger').setAttribute('aria-expanded','false'); }
$('#burger').onclick = () => { const o = $('#side').classList.toggle('open'); $('#scrim').classList.toggle('on',o); $('#burger').setAttribute('aria-expanded',o); };
$('#scrim').onclick = closeMenu;
const root = document.documentElement;
const th = store.get('theme',null); if(th) root.dataset.theme = th;
$('#theme').onclick = () => { const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches; root.dataset.theme = dark?'light':'dark'; store.set('theme', root.dataset.theme); };
const setA = on => { if(on) root.dataset.a11y='on'; else delete root.dataset.a11y; $('#a11y').setAttribute('aria-pressed', on); store.set('a11y',on); };
setA(store.get('a11y',false)); $('#a11y').onclick = () => setA(root.dataset.a11y!=='on');

/* ---------- hledání (Ctrl+K) ---------- */
let IDX = null;
function buildIndex(){
  const idx = [];
  NAV.filter(n=>n[0]!=='--').forEach(n=>idx.push({g:'Stránky',t:n[1],h:'#'+n[0],i:n[2]}));
  idx.push({g:'Stránky',t:'Osoby a skupiny',h:'#lide',i:'users'});
  SITES.forEach(s => s.lists.forEach(l => idx.push({g:'Seznamy a knihovny',t:l.title,s:s.title,h:`#seznam-${s.key}-${l.idx}`,i:KICON[l.ui]})));
  NEWS.forEach(n => idx.push({g:'Oznámení',t:n.title,s:fmtD(n.ts),news:n.id,i:'bell'}));
  SITES.forEach(s => s.lists.filter(l=>l.ui==='library'||l.ui==='links').forEach(l => l.rows.forEach(r => idx.push({g:l.ui==='links'?'Odkazy':'Dokumenty',t:r.t,s:l.title,h:r.h,e:1,i:l.ui==='links'?'link':'file'}))));
  Object.entries(D.phones).forEach(([k,rows]) => rows.forEach(r => idx.push({g:'Kontakty',t:(r.prijmeni+' '+r.jmeno).trim(),x:[r.misto,r.klapka,r.cislo,r.mobil].join(' '),s:k+(r.klapka?' · kl. '+r.klapka:''),h:'#telefony',i:'person'})));
  return idx;
}
let sel = 0;
function drawPal(){
  IDX = IDX || buildIndex();
  const q = norm($('#palIn').value.trim());
  const r = (q ? IDX.filter(x=>q.split(/\s+/).every(w=>norm(x.t+' '+(x.x||'')).includes(w))) : IDX.filter(x=>x.g==='Stránky')).slice(0,40);
  let g='', h='';
  r.forEach((x,i)=>{ if(x.g!==g){ g=x.g; h+=`<li class="grp">${g}</li>`; }
    h += `<li><a href="${x.news!=null?'#':esc(x.h)}" ${x.e?'target="_blank" rel="noopener"':''} ${x.news!=null?`data-news="${x.news}"`:''}>${svg(x.i||'file','style="width:18px;height:18px;stroke:var(--brand);fill:none;stroke-width:1.9;flex:none"')}<span>${esc(x.t)}</span>${x.s?`<small>${esc(x.s)}</small>`:''}</a></li>`; });
  $('#palList').innerHTML = h || '<li><div class="empty"><b>Nic nenalezeno</b>Zkuste kratší výraz.</div></li>'; sel = 0; mark();
}
const items = () => [...document.querySelectorAll('#palList a')];
function mark(){ items().forEach((a,i)=>a.classList.toggle('sel',i===sel)); items()[sel]?.scrollIntoView({block:'nearest'}); }
const openPal = () => { $('#palBg').classList.add('on'); $('#palIn').value=''; drawPal(); $('#palIn').focus(); };
const closePal = () => $('#palBg').classList.remove('on');
$('#openSearch').onclick = openPal;
$('#palBg').addEventListener('click', e => { if(e.target.id==='palBg') closePal(); });
$('#palList').addEventListener('click', e => { if(e.target.closest('a')) closePal(); });
$('#palIn').addEventListener('input', drawPal);
$('#palIn').addEventListener('keydown', e => {
  if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,items().length-1); mark(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); mark(); }
  else if(e.key==='Enter'){ e.preventDefault(); items()[sel]?.click(); }
});
document.addEventListener('keydown', e => {
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPal(); }
  else if(e.key==='Escape'){ closePal(); $('#mBg').classList.remove('on'); }
  else if(e.key==='/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); openPal(); }
});
route();

</script>
